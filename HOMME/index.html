<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSO STORE - Boutique</title>
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- EN-TÊTE (HEADER) --- */
        header {
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #fff;
            border: 3px solid #FF9900;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .logo-circle img {
            width: 80%;
            height: auto;
        }

        .site-name {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #131921;
        }

        /* --- CARTE PRODUIT (Accueil) --- */
        .main-container {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
            background-color: #f4f4f4;
        }

        .product-card h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .product-card .price {
            font-size: 22px;
            font-weight: bold;
            color: #B12704;
            margin-bottom: 15px;
        }

        .product-card .btn-view {
            background-color: #FFD814;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .product-card .btn-view:hover {
            background-color: #F7CA00;
        }

        /* --- MODALE (Détails + Galerie) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 10;
        }

        .close-btn:hover {
            color: #333;
        }

        /* --- GALERIE PHOTOS (Carrousel) --- */
        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .main-image-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 350px;
            background-color: #f4f4f4;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255,255,255,0.8);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .nav-arrow:hover {
            background-color: #fff;
        }

        .nav-arrow.left { left: 10px; }
        .nav-arrow.right { right: 10px; }

        .thumbnail-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px;
            max-width: 100%;
        }

        .thumbnail-strip img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
        }

        .thumbnail-strip img:hover,
        .thumbnail-strip img.active {
            border-color: #FF9900;
            opacity: 1;
        }

        /* --- INFOS PRODUIT --- */
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-info h2 {
            font-size: 24px;
            color: #131921;
        }

        .product-info .modal-price {
            font-size: 28px;
            font-weight: bold;
            color: #B12704;
        }

        .product-info .description {
            font-size: 15px;
            line-height: 1.6;
            color: #555;
        }

        .btn-buy {
            background-color: #FFA41C;
            border: none;
            border-radius: 25px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 10px;
            text-decoration: none;
            text-align: center;
            display: inline-block;
            color: #131921;
        }

        .btn-buy:hover {
            background-color: #FA8900;
        }

        /* --- RESPONSIVE --- */
        @media (min-width: 768px) {
            .modal-content {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .gallery-container {
                flex: 1;
                min-width: 300px;
            }
            .product-info {
                flex: 1;
                min-width: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- EN-TÊTE -->
    <header>
        <div class="header-content">
            <div class="logo-circle">
                <!-- Remplacez par votre logo -->
                <img src="osa.png" alt="Logo OSO STORE">
            </div>
            <div class="site-name">OSO STORE</div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <div class="main-container">
        <div class="product-card" onclick="openModal()">
            <!-- Image principale du produit -->
            <img src="02.png" alt="Mepal Bol Muesli">
            <h2>Mepal Lunch BOX</h2>
            <div class="price">3 000 DA</div>
            <button class="btn-view">Voir les détails</button>
        </div>
    </div>

    <!-- MODALE -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            
            <!-- VUE DÉTAILS + GALERIE -->
            <div id="detailsView" style="display: flex; flex-wrap: wrap; gap: 20px; width: 100%;">
                
                <!-- Galerie Photos -->
                <div class="gallery-container">
                    <div class="main-image-wrapper">
                        <button class="nav-arrow left" onclick="prevImage()">&#10094;</button>
                        <img id="mainImage" src="02.png" alt="Produit">
                        <button class="nav-arrow right" onclick="nextImage()">&#10095;</button>
                    </div>
                    <div class="thumbnail-strip" id="thumbnailStrip">
                        <img src="02.png" alt="Miniature 1" class="active" onclick="changeImage(0)">
                        <img src="03.png" alt="Miniature 2" onclick="changeImage(1)">
                        <img src="04.png" alt="Miniature 3" onclick="changeImage(2)">
                        <img src="05.png" alt="Miniature 4" onclick="changeImage(3)">
                    </div>
                </div>

                <!-- Infos Produit -->
                <div class="product-info">
                    <h2>Mepal Lunch BOX</h2>
                    <div class="modal-price">3 000 DA</div>
                    <p class="description">
                        Cet ensemble complet de lunch box est conçu pour vous accompagner partout au quotidien. Alliant design moderne et fonctionnalité, il vous permet d'emporter vos repas de manière pratique, sûre et écologique.
                    </p>
                    <!-- BOUTON QUI REDIRIGE VERS commande.html -->
                    <a href="C:\Users\utilisateur\Desktop\stor drop shiping\site\FICHE CLIENT\FICHE CLIENT.html" class="btn-buy">Acheter maintenant</a>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // --- DONNÉES DES IMAGES ---
        const images = [
            "02.png",
            "03.png",
            "04.png",
            "05.png"
        ];

        let currentIndex = 0;

        // --- FONCTIONS GALERIE ---
        function changeImage(index) {
            currentIndex = index;
            document.getElementById('mainImage').src = images[index];
            
            const thumbnails = document.querySelectorAll('#thumbnailStrip img');
            thumbnails.forEach((img, i) => {
                if (i === index) {
                    img.classList.add('active');
                } else {
                    img.classList.remove('active');
                }
            });
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            changeImage(currentIndex);
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            changeImage(currentIndex);
        }

        // --- FONCTIONS MODALE ---
        function openModal() {
            document.getElementById('productModal').style.display = 'flex';
            changeImage(0);
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        // Fermer la modale si on clique en dehors
        window.onclick = function(event) {
            const modal = document.getElementById('productModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>

</body>
</html>
